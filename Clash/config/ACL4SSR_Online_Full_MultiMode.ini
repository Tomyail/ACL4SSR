;设置规则标志位

;设置分组标志位
;========== 引擎层：总控 ==========
;默认 ♻️ 自动选择；往下可手选到地区，地区内再选 速度/手动/故障
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

;========== 引擎层：日本 ==========
custom_proxy_group=🇯🇵 日本-速度`url-test`(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)`http://www.gstatic.com/generate_204`300,,100
custom_proxy_group=🇯🇵 日本-手动`select`(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)
custom_proxy_group=🇯🇵 日本-故障`fallback`(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)`http://www.gstatic.com/generate_204`300,,100

;========== 引擎层：美国 ==========
